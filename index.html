<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Nura Medical Clinic | Premium Healthcare UAE</title>
    <meta name="description" content="Premier UAE medical clinic offering specialized healthcare, board-certified doctors, modern branch facilities in Dubai & Abu Dhabi, and instant WhatsApp booking." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://alnura-clinic.ae/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Al Nura Medical Clinic | Premium Healthcare UAE" />
    <meta property="og:description" content="Premier UAE medical clinic offering specialized healthcare, board-certified doctors, modern branch facilities in Dubai & Abu Dhabi, and instant WhatsApp booking." />
    <meta property="og:site_name" content="Al Nura Medical Clinic" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:locale:alternate" content="ar_AE" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Al Nura Medical Clinic | Premium Healthcare UAE" />
    <meta name="twitter:description" content="Premier UAE medical clinic offering specialized healthcare, board-certified doctors, modern branch facilities in Dubai & Abu Dhabi, and instant WhatsApp booking." />
    
    <!-- Google Fonts: Plus Jakarta Sans for Latin, Cairo & IBM Plex Sans Arabic for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Structured Data (JSON-LD) for UAE Medical Clinic & Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalClinic",
      "name": "Al Nura Medical Clinic",
      "alternateName": "عيادة النورة الطبية التخصصية",
      "description": "Leading multi-specialty private clinic in Dubai and Abu Dhabi providing advanced patient-centric medical treatments, clinical laboratory, and outpatient consultations.",
      "telephone": "+97148002568",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Sheikh Mohammed bin Rashid Blvd, Downtown",
        "addressLocality": "Dubai",
        "addressRegion": "Dubai",
        "addressCountry": "AE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 25.1972,
        "longitude": 55.2744
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "08:00",
          "closes": "21:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Sunday",
          "opens": "10:00",
          "closes": "18:00"
        }
      ],
      "medicalSpecialty": [
        "Cardiovascular",
        "Dermatology",
        "Pediatrics",
        "Dentistry",
        "Obstetrics and Gynecology",
        "Family Medicine",
        "Orthopedics",
        "Gastroenterology"
      ],
      "currenciesAccepted": "AED",
      "paymentAccepted": "Cash, Credit Card, Direct Billing Insurance"
    }
    </script>
  </head>
  <body class="bg-[#FAFCFB] text-[#243746] antialiased selection:bg-[#159A91]/20 selection:text-[#123047]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
